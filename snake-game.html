<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090d18"><title>Snake Duel — Online PvP</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,#17243b,#090d18 65%);color:#eef4ff;font:15px/1.4 system-ui,Segoe UI,sans-serif}.app{width:min(100%,520px)}header{display:flex;align-items:end;justify-content:space-between;margin:0 2px 15px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;color:#b8ff5c}.title{font-size:clamp(30px,8vw,46px);letter-spacing:-.05em;line-height:1;margin:5px 0 0}.scores{display:flex;justify-content:space-between;margin:0 4px 8px;font-weight:800}.p1{color:#b8ff5c}.p2{color:#55e6d0}.board{position:relative;padding:10px;border:1px solid #293750;border-radius:18px;background:#0b1220;box-shadow:0 24px 70px #0008}canvas{width:100%;height:auto;display:block;border-radius:10px;touch-action:none}.overlay{position:absolute;inset:10px;border-radius:10px;background:#08101be8;display:grid;place-items:center;text-align:center;padding:24px}.overlay.hide{display:none}.card{max-width:310px}.card h2{font-size:26px;margin:0 0 8px}.card p{color:#a9b6ca;margin:0 0 16px}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:11px 18px;background:#b8ff5c;color:#14200a;font-weight:900;cursor:pointer}.secondary{background:#172438;color:#dce7f8;border:1px solid #35445d}.input{width:110px;text-align:center;text-transform:uppercase;letter-spacing:.18em;border-radius:999px;border:1px solid #35445d;background:#0a1220;color:white;padding:10px;font-size:16px}.meta{display:flex;justify-content:space-between;margin:12px 3px;color:#a9b6ca;font-size:13px}.status{text-align:center;color:#91a0b8;font-size:12px;min-height:18px}.controls{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,44px);gap:5px;justify-content:center;margin:12px auto 0}.controls button,.fire{border:1px solid #2a3a53;background:#111a2b;color:#dbe7fa;border-radius:10px;font-size:20px;touch-action:manipulation}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}.fire{display:none;margin:8px auto 0;padding:8px 14px;color:#ffb27d;font-size:14px;font-weight:800}.hint{text-align:center;color:#78879e;font-size:12px;margin-top:13px}.key{border:1px solid #39475d;border-radius:5px;padding:1px 5px;color:#c4d0e1}@media(max-width:599px){.controls{display:grid}.fire{display:block}}
</style></head><body><main class="app">
<header><div><div class="eyebrow">REAL-TIME ONLINE · ROOM CODE</div><h1 class="title">SNAKE DUEL</h1></div></header>
<div class="scores"><span class="p1">YOU <b id="s0">000</b></span><span class="p2">OPPONENT <b id="s1">000</b></span></div>
<div class="board"><canvas id="c" width="400" height="400" aria-label="Online two player Snake game"></canvas><section class="overlay" id="overlay"><div class="card"><h2 id="heading">Play online</h2><p id="desc">Host a room and share its code, or join a friend’s room.</p><div class="row"><button class="btn" id="host">Host game</button></div><div class="row" style="margin-top:10px"><input class="input" id="roomCode" placeholder="CODE" maxlength="4" aria-label="Room code"><button class="btn secondary" id="join">Join game</button></div></div></section></div>
<div class="meta"><span>ROOM <b id="code">—</b></span><span id="role">Not connected</span></div><div class="status" id="status">Connect to the game server to play.</div>
<div class="controls" aria-label="Touch controls"><button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button></div><button class="fire" id="fire">🔥 SPIT FIRE</button>
<div class="hint">Arrows or swipe to move · <span class="key">F</span> fire spit · collect ✨ ❄ 🐍 ⭐ 🔥 · walls wrap around</div>
</main><script>
(()=>{
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),N=20,C=20,overlay=document.querySelector('#overlay'),status=document.querySelector('#status'),heading=document.querySelector('#heading'),desc=document.querySelector('#desc');let ws=null,player=-1,state=null,roomCode='';
const $=s=>document.querySelector(s);function send(data){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(data))}function connect(){if(ws&&ws.readyState===WebSocket.OPEN)return Promise.resolve();return new Promise((resolve,reject)=>{const proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(`${proto}//${location.host}`);ws.onopen=resolve;ws.onerror=()=>reject(new Error('Cannot reach the game server.'));ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'){roomCode=m.code;player=m.player;$('#code').textContent=roomCode;$('#role').textContent=player===0?'Host · Player 1':'Guest · Player 2';status.textContent='Waiting for the other player to join…'}if(m.type==='ready'){overlay.classList.add('hide');status.textContent='Game on!';}if(m.type==='state'){state=m.game;render();$('#s0').textContent=String(state.score[player]||0).padStart(3,'0');$('#s1').textContent=String(state.score[1-player]||0).padStart(3,'0');if(state.effects[player])$('#fire').textContent=`🔥 SPIT FIRE · ${state.effects[player].ammo}`}if(m.type==='error')status.textContent=m.message;if(m.type==='opponent-left'){status.textContent='Opponent disconnected.';overlay.classList.remove('hide');heading.textContent='Opponent left';desc.textContent='Host another room or join a new one.'}};ws.onclose=()=>{status.textContent='Disconnected from the game server.';overlay.classList.remove('hide')}})}
async function host(){try{await connect();send({type:'host'})}catch(e){status.textContent=e.message}}async function join(){const code=$('#roomCode').value.trim().toUpperCase();if(code.length!==4){status.textContent='Enter the 4-character room code.';return}try{await connect();send({type:'join',code})}catch(e){status.textContent=e.message}}
$('#host').onclick=host;$('#join').onclick=join;$('#roomCode').addEventListener('keydown',e=>{if(e.key==='Enter')join()});
function dir(d){send({type:'dir',dir:d})}const keymap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};window.addEventListener('keydown',e=>{if(keymap[e.key]){e.preventDefault();dir(keymap[e.key])}else if(e.key.toLowerCase()==='f')send({type:'spit'})});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>dir(b.dataset.dir));$('#fire').onclick=()=>send({type:'spit'});
let tx=0,ty=0;canvas.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))>18)dir(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')},{passive:true});
function render(){ctx.fillStyle='#0c1422';ctx.fillRect(0,0,400,400);ctx.strokeStyle='#ffffff08';for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*C);ctx.lineTo(400,i*C);ctx.stroke()}if(!state)return;
for(const f of state.food){ctx.fillStyle='#ff5c78';ctx.shadowColor='#ff5c78';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(f.x*C+10,f.y*C+10,7,0,7);ctx.fill();ctx.shadowBlur=0}const glyph={speed:'⚡',slow:'❄',giant:'🐍',points:'⭐',fire:'🔥'};for(const p of state.powerups){ctx.font='16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(glyph[p.kind],p.x*C+10,p.y*C+10)}for(const s of state.shots){ctx.fillStyle='#ff9a55';ctx.beginPath();ctx.arc(s.x*C+10,s.y*C+10,5,0,7);ctx.fill()}state.snakes.forEach((snake,i)=>snake.forEach((p,j)=>{ctx.fillStyle=i===0?(j?'#98e84c':'#d4ff82'):(j?'#40cbbd':'#83fff0');ctx.shadowColor=j?'transparent':i===0?'#b8ff5c':'#55e6d0';ctx.shadowBlur=j?0:12;ctx.beginPath();ctx.roundRect(p.x*C+2,p.y*C+2,16,16,5);ctx.fill();ctx.shadowBlur=0}))}
render();
setInterval(()=>{if(ws&&ws.readyState===WebSocket.OPEN)send({type:'ping'})},25000);
})();
</script></body></html>
